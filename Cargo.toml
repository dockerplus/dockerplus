[package]
name = "dockerplus"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A native macOS GUI for Colima and Docker, written in Rust on AppKit with real Liquid Glass."
license = "MIT"
publish = false

# Not `dockerplus`: that name belongs to the command line wrapper in bin/.
[[bin]]
name = "dockerplus-app"
path = "src/main.rs"

[features]
# Dev-only control socket used to drive the real UI in automated checks.
# Never enabled in the default build.
devtools = []

[dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true
